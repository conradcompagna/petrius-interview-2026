<!doctype html>
<html lang="en" data-static="true">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Historical Latin Document Analysis · Annotation desk</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header>
  <a class="brand" href="./" aria-label="Annotation desk home"><span class="monogram">P</span><span><strong>Historical Latin Document Analysis</strong><small>ANNOTATION DESK</small></span></a>
</header>
<main>
  <aside class="library">
    <div class="library-head"><select id="dataset" aria-label="Collection"></select></div>
    <div class="list-heading"><span id="page-count">Loading…</span></div>
    <div id="page-list" class="page-list" aria-label="Pages"></div>
  </aside>
  <section class="workspace" aria-label="Document viewer">
    <div class="page-heading"><div><span class="eyebrow" id="page-subtitle"></span><h1 id="page-title"></h1></div><div class="paging"><button id="prev" title="Previous page (←)" aria-label="Previous page">←</button><span id="position">—</span><button id="next" title="Next page (→)" aria-label="Next page">→</button></div></div>
    <div class="toolbar">
      <div class="layer-controls" aria-label="Overlay layers">
        <label><input type="checkbox" id="layer-region" checked>Regions</label>
        <label><input type="checkbox" id="layer-row" checked>Rows</label>
      </div>
      <div id="output-format" class="layer-controls" aria-label="Output format" hidden><label><input type="radio" name="fmt" value="flags" checked>Test flags</label><label><input type="radio" name="fmt" value="surprise">Language-model surprise</label></div>
      <div class="view-controls"><label class="opacity">Fill <input id="opacity" type="range" min="0" max="50" value="12" aria-label="Overlay fill opacity"></label><button id="overlays" title="Toggle overlays (O)">Hide overlays</button><button id="mistakes" title="Outline in red the lines whose label differs from the reference (M)" hidden>Mistakes</button><button id="expand" title="Give the scan the full window width">Expand</button><button id="fit" title="Fit page (F)">Fit</button><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-value">100%</span><button id="zoom-in" aria-label="Zoom in">+</button></div>
    </div>
    <div id="legend" class="legend" aria-label="Filter overlays by label"></div>
    <div id="surprise-key" class="legend" hidden></div>
    <div id="panes" class="panes">
      <section class="pane" id="pane-a"><div class="pane-head"><div><span id="name-a">Training labels</span><small id="status-a"></small></div></div><div class="viewport" id="view-a"></div></section>
    </div>
  </section>
  <aside class="inspector">
    <div class="inspector-head"><h2 id="inspect-title"></h2></div>
    <div id="selection-detail" class="selection-detail"></div>
  </aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
